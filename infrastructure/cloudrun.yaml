# Google Cloud Run service for mstrmnd-core (API + MCP HTTP + ADK).
# Build/push the image, then:
#   gcloud run services replace infrastructure/cloudrun.yaml --region=us-central1
#
# OS stays on Vercel or the mstrmnd-os image. This file is core only.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mstrmnd-core
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: ghcr.io/s7331331337s/mstrmnd-core:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: MSTRMND_HOST_MODE
              value: all
            - name: MSTRMND_CRON
              value: "1"
            - name: MSTRMND_MODEL_PROVIDER
              value: echo
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8080"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /ready
            periodSeconds: 5
            failureThreshold: 12
