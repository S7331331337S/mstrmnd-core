# Google Cloud Run service for mstrmnd-core (API + MCP HTTP + ADK).
# Build/push the image, then:
#   gcloud run services replace infrastructure/cloudrun.yaml --region=us-central1
#
# OS stays on Vercel or the mstrmnd-os image. This file is core only.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mstrmnd-core
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: ghcr.io/s7331331337s/mstrmnd-core:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: MSTRMND_HOST_MODE
              value: all
            - name: MSTRMND_CRON
              value: "1"
            # Prod model provider: Vercel AI Gateway via the existing `openai-compatible`
            # provider (config only; no Gateway-specific code in core).
            - name: MSTRMND_MODEL_PROVIDER
              value: openai-compatible
            - name: MSTRMND_MODEL_BASE_URL
              value: https://ai-gateway.vercel.sh/v1
            # TODO(Steele): create the Secret Manager secret `AI_GATEWAY_API_KEY` (an AI Gateway
            # key). It does not exist yet, so Cloud Run stays fail-closed (deploy will not start)
            # until you create and populate it. Nothing here creates a key or enables spend.
            # core reads its key from MSTRMND_MODEL_API_KEY, so the secret is mapped onto that name.
            - name: MSTRMND_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: AI_GATEWAY_API_KEY
                  key: latest
            # TODO(Steele): replace the placeholder with a real Gateway `provider/model` id before
            # deploying (example form only, not a decision: `anthropic/claude-sonnet-4.5`). Core
            # passes this string through untouched. Do not leave the placeholder: it is
            # intentionally not a valid model and Gateway will reject it.
            - name: MSTRMND_MODEL_NAME
              value: PLACEHOLDER-provider/PLACEHOLDER-model
            # Egress (opt-in; deny-all when unset). Exactly one host, no wildcards.
            - name: MSTRMND_EGRESS_ALLOWLIST
              value: ai-gateway.vercel.sh
            # TODO(Steele): set a real per-process USD cap for model calls. "0" is a deliberate
            # placeholder: it denies every model call (fail closed) until you choose a number.
            # Also set MSTRMND_MODEL_CALL_BUDGET_USD (per-call reservation, e.g. via this file or
            # a secret); without it every call is denied by the boundary cost check.
            - name: MSTRMND_MODEL_PROCESS_BUDGET_USD
              value: "0"
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8080"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /ready
            periodSeconds: 5
            failureThreshold: 12
