# Google Cloud Run service for mstrmnd-core (API + MCP HTTP + ADK).
# Build/push the image, then:
#   gcloud run services replace infrastructure/cloudrun.yaml --region=us-central1
#
# OS stays on Vercel or the mstrmnd-os image. This file is core only.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mstrmnd-core
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: ghcr.io/s7331331337s/mstrmnd-core:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: MSTRMND_HOST_MODE
              value: all
            - name: MSTRMND_CRON
              value: "1"
            # TODO(Steele): prod model provider = Vercel AI Gateway (decided via CoS), but the
            # core runtime has no Gateway provider yet: intelligence-core supports only
            # `openai` | `openai-compatible` (+ test-only `echo`). Until a provider is chosen
            # and wired, MSTRMND_MODEL_PROVIDER is intentionally unset and core fails closed.
            # Deploy is blocked until the AI Gateway key secret below is created and populated
            # by Steele. Do not create keys or enable spend from this file.
            - name: MSTRMND_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: PLACEHOLDER-ai-gateway-api-key # TODO(Steele): Secret Manager secret, not yet created
                  key: latest
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8080"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /ready
            periodSeconds: 5
            failureThreshold: 12
