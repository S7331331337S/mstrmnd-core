name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager" (pnpm@10.0.0)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Workspace and approval tests
        run: pnpm test

      - name: Board policy tests
        run: pnpm exec tsx --test mstrmnd-os/lib/board-policy.test.ts

      - name: Doctrine pin + fixture self-test
        run: pnpm doctrine:ci

      - name: Sync live doctrine when actively pinned
        if: ${{ hashFiles('doctrine.pin.json') != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSTRMND_DOCTRINE_TOKEN: ${{ secrets.MSTRMND_DOCTRINE_TOKEN }}
        run: |
          status=$(python3 -c 'import json; print(json.load(open("doctrine.pin.json"))["status"])')
          if [ "$status" = "active" ]; then
            python3 scripts/sync-doctrine.py
            python3 scripts/validate-doctrine.py --strict
          else
            echo "Pin status is $status — skipping live doctrine sync."
          fi

      - name: Hermes orchestrator dry-run
        run: pnpm --filter @mstrmnd/hermes exec tsx src/index.ts --dry-run --goal "CI dry-run"

      - name: Calibration (echo)
        run: pnpm calibrate

      - name: Stack tools (Vercel CLI/SDK + GitHub CLI)
        env:
          MSTRMND_TOOLS_LIVE: "0"
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          pnpm --filter @mstrmnd/stack-tools exec vercel --version
          pnpm stack:tools
          pnpm stack:tools -- --live --json | tee /tmp/stack-tools-live.json

  stack-image:
    name: core image smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build core image
        run: docker build -f infrastructure/Dockerfile.core -t mstrmnd-core:ci .

      - name: Compose config
        run: docker compose -f infrastructure/docker-compose.stack.yml config >/dev/null

      - name: Run and smoke
        run: |
          docker run -d --name mstrmnd-core-ci -p 8080:8080 -e MSTRMND_CRON=0 mstrmnd-core:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/ready
          curl -fsS http://127.0.0.1:8080/adk
          curl -fsS http://127.0.0.1:8080/.well-known/agent.json
          curl -fsS http://127.0.0.1:8080/v1/tools
          docker exec mstrmnd-core-ci gh --version
          docker exec mstrmnd-core-ci vercel --version
          curl -fsS -X POST http://127.0.0.1:8080/v1/runs \
            -H 'content-type: application/json' \
            -d '{"goal":"CI stack smoke","dryRun":true}'
          docker logs mstrmnd-core-ci | tail -n 40
          docker rm -f mstrmnd-core-ci

  # Nested workspace (Node 24). Keep out of the root pnpm graph —
  # Hermes/MCP and eve OS are two runtimes until a later adapter.
  mstrmnd-os:
    name: mstrmnd-os typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mstrmnd-os/pnpm-lock.yaml

      - name: Install mstrmnd-os
        run: pnpm --dir mstrmnd-os install --frozen-lockfile

      - name: Typecheck mstrmnd-os
        run: pnpm --dir mstrmnd-os typecheck

      - name: Build mstrmnd-os
        run: pnpm --dir mstrmnd-os build

  board:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/board
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize lockfile and assets
        run: bash scripts/materialize-vendor.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/board/package-lock.json

      - name: Install Board
        run: npm ci

      - name: Typecheck Board
        run: npm run typecheck

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Test Board SSE decoder
        run: npm test
